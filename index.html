<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PZ 基地物資表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ===== 設定區在 <script> 最上方的 SHEET_CSV_URL ===== */
:root{
  --bg:#14150f; --panel:#1d1f17; --panel2:#24271d; --line:#33372a;
  --text:#e4e2d4; --muted:#9a9a86; --dim:#6d6e5e;
  --accent:#d4a72c; --accent2:#c2542d; --ok:#8fae4a;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans TC',system-ui,sans-serif;font-size:15px}
body{background-image:radial-gradient(circle at 20% -10%,#2a2d1f 0,transparent 55%),repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.012) 3px 4px);min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 60px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:2px solid var(--line);padding-bottom:14px}
.brand small{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--accent2);text-transform:uppercase}
h1{margin:4px 0 0;font-size:26px;letter-spacing:.04em}
h1 span{color:var(--accent)}
.stats{display:flex;gap:18px;font-family:var(--mono)}
.stat b{display:block;font-size:22px;color:var(--accent)}
.stat i{font-style:normal;font-size:11px;color:var(--muted);letter-spacing:.08em}
.src{font-size:12px;color:var(--dim);margin-top:6px}
.src.live{color:var(--ok)}

.controls{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 85%,transparent);padding:14px 0 10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{flex:1 1 260px;position:relative}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:11px 36px 11px 14px;font:inherit;border-radius:4px;outline:none}
.search input:focus{border-color:var(--accent)}
.search button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer;display:none}
select,.toggle{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:10px 12px;font:inherit;border-radius:4px;cursor:pointer}
.toggle{display:flex;gap:0;padding:0;overflow:hidden}
.toggle button{background:none;border:0;color:var(--muted);padding:10px 14px;font:inherit;cursor:pointer}
.toggle button.on{background:var(--accent);color:#1a1a10;font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:thin}
.chip{flex:none;background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:6px 11px;border-radius:999px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--dim);margin-left:5px}
.chip.on{border-color:var(--accent);color:var(--accent);background:#2a2716}
.chip.on em{color:var(--accent)}

.group{margin-top:22px}
.group h2{display:flex;align-items:baseline;gap:10px;font-size:16px;margin:0 0 8px;padding:8px 12px;background:var(--panel2);border-left:4px solid var(--accent2);border-radius:2px}
.group h2 small{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:400}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:500;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
th.num,td.num{text-align:right}
th .arr{color:var(--accent)}
td{padding:8px 10px;border-bottom:1px solid #26291f;vertical-align:top}
tr:hover td{background:#1f2219}
td.name{font-weight:500}
@media (min-width:641px){.group table{max-width:820px} td.name{width:55%}}
td.num{font-family:var(--mono);font-weight:700;color:var(--accent);width:80px}
.cat{display:inline-block;font-size:12px;color:#d9b54a;border:1px solid #4a4425;padding:1px 7px;border-radius:3px;white-space:nowrap}
.cat.w{color:#e07b5a;border-color:#5a3326}
.loc{display:inline-block;font-size:12px;color:var(--muted);background:#262a1e;padding:2px 7px;border-radius:3px;margin:1px 3px 1px 0;white-space:nowrap}
.loc b{font-family:var(--mono);color:var(--text);margin-left:4px}
mark{background:#5a4a10;color:#fff;border-radius:2px}
.empty{text-align:center;color:var(--dim);padding:50px 0}
footer{margin-top:40px;font-size:12px;color:var(--dim);text-align:center}

@media (max-width:640px){
  h1{font-size:21px}
  .stats{gap:12px}.stat b{font-size:18px}
  thead{display:none}
  table,tbody,tr,td{display:block}
  tr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 4px;border-bottom:1px solid #26291f}
  td{border:0;padding:0}
  td.name{grid-column:1}
  td.num{grid-column:2;grid-row:1 / span 2;align-self:center;font-size:17px;width:auto}
  td.meta{grid-column:1}
}
@media (min-width:641px){ td.meta{display:none} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <small>Project Zomboid · Base Inventory</small>
      <h1>基地<span>物資表</span></h1>
      <div class="src" id="src">讀取中…</div>
    </div>
    <div class="stats">
      <div class="stat"><b id="sTypes">0</b><i>品項</i></div>
      <div class="stat"><b id="sQty">0</b><i>總數量</i></div>
      <div class="stat"><b id="sLocs">0</b><i>存放處</i></div>
    </div>
  </header>

  <div class="controls">
    <div class="row">
      <div class="search">
        <input id="q" type="search" placeholder="搜尋物品、類型或位置…（例如：膠帶、彈藥、綠櫃）" autocomplete="off">
        <button id="clr" aria-label="清除">×</button>
      </div>
      <select id="cat"><option value="">全部類型</option></select>
      <div class="toggle" id="view">
        <button data-v="loc" class="on">依位置</button>
        <button data-v="sum">合計</button>
      </div>
    </div>
    <div class="chips" id="locs"></div>
  </div>

  <main id="out"></main>
  <footer>資料由截圖整理 · 點欄位標題可排序</footer>
</div>

<script>
/* ============ 設定 ============
   把 Google 試算表的 CSV 連結貼在這裡，網頁就會改讀試算表。
   格式：https://docs.google.com/spreadsheets/d/【試算表ID】/gviz/tq?tqx=out:csv
   留空就用上面的內建資料。                                         */
const SHEET_CSV_URL = '';
/* ============================== */

const $ = s => document.querySelector(s);
const state = { q:'', cat:'', loc:'', view:'loc', sort:{key:'name',dir:1} };
let items = [];

function parseCSV(text){
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f); if(row.some(x=>x.trim()))rows.push(row); row=[]; f=''; }
    else f+=c;
  }
  row.push(f); if(row.some(x=>x.trim())) rows.push(row);
  return rows;
}
function toItems(text){
  const rows=parseCSV(text.trim()); const h=rows.shift().map(s=>s.trim());
  const ix=k=>h.indexOf(k);
  const [n,c,t,l]=[ix('名稱'),ix('數量'),ix('類型'),ix('位置')];
  return rows.map(r=>({
    name:(r[n]||'').trim(), qty:parseInt(r[c],10)||0,
    cat:(r[t]||'').trim(), loc:(r[l]||'').trim()
  })).filter(x=>x.name);
}
const mainCat = c => c.split('/')[0];
const parentLoc = l => l.split('・')[0];
const esc = s => s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function hl(s){
  const e=esc(s); if(!state.q) return e;
  const qq=esc(state.q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return e.replace(new RegExp(qq,'gi'),m=>`<mark>${m}</mark>`);
}
const fmt = n => n.toLocaleString('zh-TW');

async function load(){
  if(SHEET_CSV_URL){
    try{
      const r=await fetch(SHEET_CSV_URL,{cache:'no-store'});
      if(!r.ok) throw 0;
      items=toItems(await r.text());
      $('#src').textContent='● 即時資料：Google 試算表';
      $('#src').classList.add('live');
    }catch(e){
      items=toItems($('#data').textContent);
      $('#src').textContent='⚠ 讀不到試算表，改用內建資料';
    }
  } else {
    items=toItems($('#data').textContent);
    $('#src').textContent='內建資料';
  }
  buildFilters(); render();
}

function buildFilters(){
  const cats={}; items.forEach(i=>{const m=mainCat(i.cat); cats[m]=(cats[m]||0)+1;});
  $('#cat').innerHTML='<option value="">全部類型</option><option value="__w">⚔ 可當武器</option>'+
    Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<option value="${esc(k)}">${esc(k)}（${v}）</option>`).join('');
  const locs={}; items.forEach(i=>{const p=parentLoc(i.loc); locs[p]=(locs[p]||0)+1;});
  const order=Object.keys(locs);
  $('#locs').innerHTML=`<button class="chip on" data-l="">全部<em>${items.length}</em></button>`+
    order.map(k=>`<button class="chip" data-l="${esc(k)}">${esc(k)}<em>${locs[k]}</em></button>`).join('');
}

function filtered(){
  const q=state.q.toLowerCase();
  return items.filter(i=>{
    if(state.loc && parentLoc(i.loc)!==state.loc) return false;
    if(state.cat==='__w'){ if(!i.cat.includes('武器')) return false; }
    else if(state.cat && mainCat(i.cat)!==state.cat) return false;
    if(q && !(i.name+' '+i.cat+' '+i.loc).toLowerCase().includes(q)) return false;
    return true;
  });
}
function sorter(a,b){
  const {key,dir}=state.sort;
  if(key==='qty') return (a.qty-b.qty)*dir || a.name.localeCompare(b.name,'zh-Hant');
  return String(a[key]).localeCompare(String(b[key]),'zh-Hant')*dir;
}
function th(key,label,cls=''){
  const s=state.sort; const a=s.key===key?`<span class="arr">${s.dir>0?'▲':'▼'}</span>`:'';
  return `<th class="${cls}" data-k="${key}">${label} ${a}</th>`;
}
const catTag = c => `<span class="cat${c.includes('武器')?' w':''}">${esc(c)}</span>`;

function render(){
  const list=filtered();
  const qty=list.reduce((s,i)=>s+i.qty,0);
  const names=new Set(list.map(i=>i.name));
  $('#sTypes').textContent=fmt(names.size);
  $('#sQty').textContent=fmt(qty);
  $('#sLocs').textContent=new Set(list.map(i=>i.loc)).size;
  $('#clr').style.display=state.q?'block':'none';
  if(!list.length){ $('#out').innerHTML='<div class="empty">找不到符合的物品</div>'; return; }

  if(state.view==='sum'){
    const m=new Map();
    list.forEach(i=>{
      if(!m.has(i.name)) m.set(i.name,{name:i.name,cat:i.cat,qty:0,locs:[]});
      const g=m.get(i.name); g.qty+=i.qty; g.locs.push(i);
    });
    const rows=[...m.values()].sort(state.sort.key==='loc'?(a,b)=>b.locs.length-a.locs.length:sorter);
    $('#out').innerHTML=`<div class="group"><table><thead><tr>${th('name','名稱')}${th('qty','合計','num')}${th('cat','類型')}${th('loc','存放位置')}</tr></thead><tbody>`+
      rows.map(g=>{
        const locs=g.locs.map(l=>`<span class="loc">${hl(l.loc)}<b>${l.qty}</b></span>`).join('');
        return `<tr><td class="name">${hl(g.name)}</td><td class="num">${fmt(g.qty)}</td><td class="meta">${catTag(g.cat)} ${locs}</td><td>${catTag(g.cat)}</td><td>${locs}</td></tr>`;
      }).join('')+'</tbody></table></div>';
    fixDesktopCols(); return;
  }

  const groups=new Map();
  list.forEach(i=>{ if(!groups.has(i.loc)) groups.set(i.loc,[]); groups.get(i.loc).push(i); });
  $('#out').innerHTML=[...groups].map(([loc,arr])=>{
    arr.sort(sorter);
    const tot=arr.reduce((s,i)=>s+i.qty,0);
    return `<section class="group"><h2>${hl(loc)} <small>${arr.length} 項 · ${fmt(tot)} 件</small></h2><table><thead><tr>${th('name','名稱')}${th('qty','數量','num')}${th('cat','類型')}</tr></thead><tbody>`+
      arr.map(i=>`<tr><td class="name">${hl(i.name)}</td><td class="num">${fmt(i.qty)}</td><td class="meta">${catTag(i.cat)}</td><td>${catTag(i.cat)}</td></tr>`).join('')+
      '</tbody></table></section>';
  }).join('');
  fixDesktopCols();
}
/* 手機版用 .meta 欄，桌機版隱藏；桌機的獨立欄在手機隱藏 */
function fixDesktopCols(){
  const mobile=matchMedia('(max-width:640px)').matches;
  document.querySelectorAll('tbody tr').forEach(tr=>{
    [...tr.children].forEach((td,i)=>{ if(i>=3) td.style.display=mobile?'none':''; });
  });
}
addEventListener('resize',fixDesktopCols);

$('#q').addEventListener('input',e=>{state.q=e.target.value.trim();render();});
$('#clr').addEventListener('click',()=>{$('#q').value='';state.q='';render();$('#q').focus();});
$('#cat').addEventListener('change',e=>{state.cat=e.target.value;render();});
$('#locs').addEventListener('click',e=>{
  const b=e.target.closest('.chip'); if(!b) return;
  state.loc=b.dataset.l;
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));
  render();
});
$('#view').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  state.view=b.dataset.v;
  document.querySelectorAll('#view button').forEach(x=>x.classList.toggle('on',x===b));
  render();
});
$('#out').addEventListener('click',e=>{
  const h=e.target.closest('th'); if(!h) return;
  const k=h.dataset.k;
  state.sort = state.sort.key===k ? {key:k,dir:-state.sort.dir} : {key:k,dir:k==='qty'?-1:1};
  render();
});
load();
</script>
